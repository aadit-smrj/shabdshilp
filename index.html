    <script>
      // Neutralize Vite HMR WebSocket reconnect attempts and console errors in AI Studio iframe environment
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Filter out [vite] websocket error & warning logs from console
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { 
            return String(a && (a.stack || a.message || a) || ''); 
          }).join(' ');
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('Illegal invocation') !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { 
            return String(a && (a.stack || a.message || a) || ''); 
          }).join(' ');
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('Illegal invocation') !== -1
          ) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        // 2. Global rejection & error handlers to suppress any Vite HMR WebSocket issues
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var str = String(reason && (reason.stack || reason.message || reason) || '');
          if (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('Illegal invocation') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = String(event.message || '') + ' ' + String(event.filename || '');
          if (event.error) {
            msg += ' ' + String(event.error.stack || event.error.message || '');
          }
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('Illegal invocation') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 3. Robust Vite WebSocket Mock that inherits from EventTarget (NOT NativeWebSocket.prototype to avoid Illegal invocation)
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function FakeWebSocket(url, protocols) {
            var isVite = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) isVite = true;
            if (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; })) isVite = true;
            if (typeof url === 'string' && (
              url.indexOf('vite') !== -1 ||
              url.indexOf('ais-dev') !== -1 ||
              url.indexOf('run.app') !== -1 ||
              url.indexOf(':3000') !== -1 ||
              url.indexOf('localhost') !== -1 ||
              url.indexOf('127.0.0.1') !== -1
            )) {
              isVite = true;
            }

            if (!isVite) {
              try {
                return new NativeWebSocket(url, protocols);
              } catch (e) {
                // Fallback to fake if native constructor fails in sandboxed iframe
              }
            }

            // Create a clean mock object without NativeWebSocket prototype accessors
            var target = new EventTarget();

            target.url = url || '';
            target.readyState = 1; // WebSocket.OPEN
            target.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
            target.bufferedAmount = 0;
            target.binaryType = 'blob';
            target.extensions = '';
            target.onopen = null;
            target.onclose = null;
            target.onerror = null;
            target.onmessage = null;

            var origAdd = target.addEventListener.bind(target);
            target.addEventListener = function(type, listener, options) {
              origAdd(type, listener, options);
              if (type === 'open') {
                setTimeout(function() {
                  try {
                    var ev = new Event('open');
                    target.dispatchEvent(ev);
                    if (typeof target.onopen === 'function') target.onopen(ev);
                  } catch (e) {}
                }, 10);
              }
            };

            target.send = function() {};
            target.close = function() {
              target.readyState = 3;
              try {
                var ev = new Event('close');
                target.dispatchEvent(ev);
                if (typeof target.onclose === 'function') target.onclose(ev);
              } catch (e) {}
            };

            setTimeout(function() {
              try {
                var ev = new Event('open');
                target.dispatchEvent(ev);
                if (typeof target.onopen === 'function') target.onopen(ev);
              } catch (e) {}
            }, 10);

            return target;
          }

          FakeWebSocket.prototype = Object.create(EventTarget.prototype);
          FakeWebSocket.prototype.constructor = FakeWebSocket;
          FakeWebSocket.CONNECTING = 0;
          FakeWebSocket.OPEN = 1;
          FakeWebSocket.CLOSING = 2;
          FakeWebSocket.CLOSED = 3;

          try {
            Object.defineProperty(FakeWebSocket, Symbol.hasInstance, {
              value: function(inst) {
                return (inst instanceof NativeWebSocket) || (inst && inst.readyState !== undefined);
              }
            });
          } catch (e) {}

          window.WebSocket = FakeWebSocket;
        }
      })();
    </script>
